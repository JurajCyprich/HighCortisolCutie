<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kortizol reset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --stress: 100;
    --bg: #101012;
    --bg2: #17171a;
    --accent: #E8593E;
    --accent-rgb: 232,89,62;
    --accent-soft: #FFD8C7;
    --ink: #EDEAE6;
    --muted: #8C8A87;
    --card: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.11);
    --ring: #E8593E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Nunito', sans-serif;
    background: radial-gradient(ellipse 1000px 700px at 50% -10%, var(--bg2), var(--bg) 65%);
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 18px;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
  body::before, body::after{
    content:'';
    position:fixed;
    border-radius:50%;
    z-index:-2;
    pointer-events:none;
    filter: blur(120px);
    transition: background 0.9s ease;
  }
  body::before{
    width:60vmax; height:60vmax;
    top:-30vmax; left:50%;
    transform: translateX(-62%);
    background: radial-gradient(circle, rgba(var(--accent-rgb),0.5), transparent 68%);
    opacity:0.55;
  }
  body::after{
    width:65vmax; height:65vmax;
    bottom:-34vmax; left:50%;
    transform: translateX(-38%);
    background: radial-gradient(circle, rgba(124,108,240,0.42), transparent 70%);
    opacity:0.5;
  }
  body > .grain{
    content:'';
    position:fixed;
    inset:-10%;
    z-index:-1;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .wrap{
    width:100%;
    max-width: 480px;
    position:relative;
    z-index:1;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(1.7rem, 5.5vw, 2.35rem);
    line-height:1.18;
    margin: 0 0 10px;
    color: var(--ink);
    text-align:left;
  }
  .sub{
    font-size:1rem;
    line-height:1.5;
    color: var(--muted);
    margin: 0 0 28px;
    text-align:left;
    max-width: 42ch;
  }

  .species-picker{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    gap: 2px;
    margin-bottom: 28px;
    padding: 5px;
    position:relative;
    scrollbar-width:none;
    background: linear-gradient(165deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), inset 0 -6px 14px rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.28);
  }
  .species-picker::-webkit-scrollbar{ display:none; }
  .species-btn{
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 14px;
    flex:0 0 auto;
    white-space:nowrap;
    cursor:pointer;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    border-radius: 999px;
    position:relative;
    z-index:2;
    transition: color 0.25s ease;
  }
  .species-btn:hover{ transform:none; color: var(--ink); }
  .species-btn.active{ color: #fff; }
  .tab-indicator{
    position:absolute;
    top:5px;
    left:0;
    bottom:5px;
    width:0;
    border-radius: 999px;
    z-index:1;
    background: linear-gradient(165deg, rgba(255,255,255,0.32), rgba(255,255,255,0.05) 40%, rgba(var(--accent-rgb),0.55) 130%),
                rgba(var(--accent-rgb),0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -3px 6px rgba(0,0,0,0.18), 0 4px 12px rgba(var(--accent-rgb),0.35);
    transform: translateX(0);
    transition: transform 0.35s cubic-bezier(.65,0,.35,1), width 0.35s cubic-bezier(.65,0,.35,1), background 0.4s ease, box-shadow 0.4s ease;
    pointer-events:none;
  }

  .meter{
    margin-bottom: 26px;
  }
  .meter-labels{
    display:flex;
    justify-content:space-between;
    font-size:0.75rem;
    font-weight:600;
    color: var(--muted);
    margin-bottom:8px;
  }
  .meter-track{
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.09);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    overflow:hidden;
    position:relative;
  }
  .meter-fill{
    height:100%;
    border-radius:999px;
    background: var(--accent);
    width:100%;
    transition: width 0.7s cubic-bezier(.3,.9,.3,1), background 0.9s ease;
  }
  .meter-caption{
    margin-top:10px;
    font-weight:600;
    font-size:0.92rem;
    color: var(--muted);
    transition: color 0.9s ease;
  }

  .card{
    background: linear-gradient(165deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.05));
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -12px 24px rgba(0,0,0,0.18), 0 24px 48px rgba(0,0,0,0.4);
    margin-bottom: 20px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:-60%;
    left:-30%;
    width:70%;
    height:140%;
    background: linear-gradient(115deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 55%);
    transform: rotate(8deg);
    pointer-events:none;
  }
  .photo-frame{
    width:100%;
    aspect-ratio: 4/3;
    border-radius: 14px;
    overflow:hidden;
    background: rgba(255,255,255,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform: scale(1.03);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.7,.3,1);
  }
  .photo-frame img.loaded{ opacity:1; transform: scale(1); cursor: zoom-in; }

  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(8,6,10,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 1000;
    cursor: zoom-out;
  }
  .lightbox.open{ display:flex; }
  .lightbox-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:100%;
    max-height:100%;
  }
  .lightbox img{
    max-width: 100%;
    max-height: 78vh;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><text y='38' font-size='40'>%E2%9C%8B</text></svg>") 20 20, pointer;
    transform-origin: 50% 100%;
  }
  @keyframes petSquish{
    0%   { transform: scaleY(1)    translateY(0); }
    30%  { transform: scaleY(0.82) translateY(6%); }
    55%  { transform: scaleY(1.09) translateY(-3%); }
    78%  { transform: scaleY(0.96) translateY(1%); }
    100% { transform: scaleY(1)    translateY(0); }
  }
  .lightbox img.petted{
    animation: petSquish 0.38s ease;
  }
  .pet-hint{
    color: rgba(255,255,255,0.7);
    font-size:0.85rem;
    font-weight:500;
    margin-top:14px;
    text-align:center;
  }
  .pet-count{
    color: rgba(255,255,255,0.4);
    font-size:0.78rem;
    margin-top:4px;
  }
  .confetti-piece{
    position: fixed;
    top: -20px;
    width: 9px;
    height: 14px;
    z-index: 1100;
    pointer-events:none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%   { transform: translateY(0) rotate(0deg); opacity:1; }
    100% { transform: translateY(105vh) rotate(540deg); opacity:0.9; }
  }
  .lightbox-close{
    position:absolute;
    top: 18px;
    right: 22px;
    color:#fff;
    font-size: 1.8rem;
    font-weight:400;
    background:none;
    border:none;
    cursor:pointer;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    line-height:1;
    padding:6px 10px;
  }
  .lightbox-close:hover{ transform:none; opacity:0.8; }
  .loader{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:10px;
    font-size:0.85rem;
    color: var(--muted);
    font-weight:500;
  }
  .loader.visible{ display:flex; }
  .spinner{
    width:30px;
    height:30px;
    border-radius:50%;
    border: 3px solid rgba(255,255,255,0.14);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
    transition: border-top-color 0.9s ease;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .caption-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
  }
  .caption{
    font-size:0.9rem;
    color: var(--muted);
    min-height:1.3em;
    text-align:left;
  }
  .download-btn{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:0.8rem;
    color: var(--ink);
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    padding: 7px 12px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }
  .download-btn:hover{ transform:none; background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.24); }
  .download-btn:active{ transform: scale(0.97); }
  .download-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
  .download-btn svg{ flex:0 0 auto; }

  button{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:1rem;
    color:#fff;
    background:
      linear-gradient(165deg, rgba(255,255,255,0.30), rgba(255,255,255,0.04) 45%, rgba(var(--accent-rgb),0.55) 140%),
      rgba(var(--accent-rgb),0.82);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.32);
    padding: 13px 26px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -5px 10px rgba(0,0,0,0.15), 0 12px 26px rgba(var(--accent-rgb),0.32);
    transition: transform 0.15s ease, background 0.9s ease, box-shadow 0.9s ease, opacity 0.15s ease;
  }
  button:hover{ transform: translateY(-1px); opacity:0.97; }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity:0.5; cursor:default; transform:none; }

  .cta{
    text-align:center;
  }
  .done{
    display:none;
    font-size:0.95rem;
    font-weight:600;
    margin-top:16px;
    color: var(--muted);
    text-align:center;
  }
  .reset-link{
    display:inline-block;
    margin-top:12px;
    font-size:0.85rem;
    color: var(--muted);
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Nunito',sans-serif;
    font-weight:600;
    padding:6px 0;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    text-align:center;
  }
  .reset-link:hover{ transform:none; color: var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<!-- Zvukové efekty: polož tieto mp3 súbory do rovnakého priečinka ako toto
     HTML (alebo uprav pole/y v <script> nižšie: UNIVERSAL_SOUNDS, speciesSounds).
     Pre každú kategóriu sú 3 varianty zvuku — náhodne sa strieda medzi nimi,
     ale nikdy sa dvakrát za sebou nezopakuje ten istý súbor.

     - click1.mp3, click2.mp3, click3.mp3   -> univerzálny zvuk pri "Náhodne"
     - dog1.mp3,   dog2.mp3,   dog3.mp3     -> kategória "Psy"
     - cat1.mp3,   cat2.mp3,   cat3.mp3     -> kategória "Mačky"
     - fox1.mp3,   fox2.mp3,   fox3.mp3     -> kategória "Líšky"
     - duck1.mp3,  duck2.mp3,  duck3.mp3    -> kategória "Kačky"
     - bird1.mp3,  bird2.mp3,  bird3.mp3    -> kategória "Vtáky"
     - rabbit1.mp3, rabbit2.mp3, rabbit3.mp3 -> kategória "Zajace"
     - confetti.mp3 -> zvuk pri každom 50. pohladkaní (spolu s konfetami)

     Rovnaký zdroj (náhodne vybraný z trojice) sa použije aj pri kliknutí na
     "Ukáž mi zvieratko", aj pri každom pohladkaní v priblíženom náhľade. -->

<div class="wrap">
  <h1 id="headline">Vysoký kortizol. Poďme ho zraziť.</h1>
  <p class="sub">Klikaj na tlačidlo a pozeraj roztomité zvieratká, kým sa mierka neupokojí.</p>

  <div class="species-picker" id="speciesPicker">
    <button class="species-btn active" data-species="random">Náhodne</button>
    <button class="species-btn" data-species="dog">Psy</button>
    <button class="species-btn" data-species="cat">Mačky</button>
    <button class="species-btn" data-species="fox">Líšky</button>
    <button class="species-btn" data-species="duck">Kačky</button>
    <button class="species-btn" data-species="bird">Vtáky</button>
    <button class="species-btn" data-species="rabbit">Zajace</button>
    <span class="tab-indicator" id="tabIndicator"></span>
  </div>

  <div class="meter">
    <div class="meter-labels"><span>Nízky kortizol</span><span>Vysoký kortizol</span></div>
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
    <div class="meter-caption" id="meterCaption">100 % v strese</div>
  </div>

  <div class="card">
    <div class="photo-frame" id="photoFrame">
      <div class="loader" id="loader">
        <span class="spinner"></span>
        <span id="loaderText">hľadám zvieratko…</span>
      </div>
      <img id="animalImg" alt="Roztomité zvieratko">
    </div>
    <div class="caption-row">
      <div class="caption" id="caption">Zatiaľ žiadne zvieratko. Klikni nižšie.</div>
      <button class="download-btn" id="downloadBtn" style="display:none;" title="Stiahnuť obrázok" aria-label="Stiahnuť obrázok">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Stiahnuť
      </button>
    </div>
  </div>

  <div class="cta">
    <button id="nextBtn">Ukáž mi zvieratko</button>
    <div class="done" id="doneMsg">Kortizol je dole. Môžeš sa vrátiť do života.</div>
    <button class="reset-link" id="resetBtn" style="display:none;">začať znova od vysokého stresu</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <div class="lightbox-inner">
    <img id="lightboxImg" alt="Zväčšené roztomité zvieratko">
    <div class="pet-hint">Klikni na zvieratko a pohladkaj ho</div>
    <div class="pet-count" id="petCount"></div>
  </div>
</div>

<script>
  const STEP = 14;
  let stress = 100;
  let loading = false;

  const meterFill = document.getElementById('meterFill');
  const meterCaption = document.getElementById('meterCaption');
  const headline = document.getElementById('headline');
  const caption = document.getElementById('caption');
  const downloadBtn = document.getElementById('downloadBtn');
  const img = document.getElementById('animalImg');
  const loader = document.getElementById('loader');
  const loaderText = document.getElementById('loaderText');
  const spinner = loader.querySelector('.spinner');
  const btn = document.getElementById('nextBtn');
  const doneMsg = document.getElementById('doneMsg');
  const resetBtn = document.getElementById('resetBtn');
  const body = document.body;

  const stages = [
    { max: 100, color: '#E8593E', caption: '% v strese', headline: 'Vysoký kortizol. Poďme ho zraziť.' },
    { max: 75,  color: '#E8813E', caption: '% napätia', headline: 'Trochu sa to uvoľňuje.' },
    { max: 50,  color: '#E0A24A', caption: '% stresu', headline: 'Polovica cesty k pokoju.' },
    { max: 25,  color: '#8FAE5A', caption: '% napätia', headline: 'Kortizol klesá slušne.' },
    { max: 0,   color: '#4C9A6A', caption: '% stresu', headline: 'Nízky kortizol. Hotovo.' },
  ];

  function stageFor(value){
    for(const s of stages){ if(value >= s.max) return s; }
    return stages[stages.length-1];
  }

  function hexToRgb(hex){
    const m = hex.replace('#','');
    const r = parseInt(m.substring(0,2), 16);
    const g = parseInt(m.substring(2,4), 16);
    const b = parseInt(m.substring(4,6), 16);
    return `${r},${g},${b}`;
  }

  function applyStage(){
    const s = stageFor(stress);
    document.documentElement.style.setProperty('--accent', s.color);
    document.documentElement.style.setProperty('--accent-rgb', hexToRgb(s.color));
    meterFill.style.width = stress + '%';
    meterCaption.textContent = Math.round(stress) + ' ' + s.caption;
    headline.textContent = s.headline;
  }

  const speciesLabels = {
    dog: 'Psík', cat: 'Mačka', fox: 'Líška', duck: 'Kačka',
    bird: 'Vtáčik', rabbit: 'Zajac'
  };
  const allSpecies = Object.keys(speciesLabels);
  let currentSpecies = 'random';

  // Universal sounds are used when "Náhodne" is selected; each species gets
  // its own 3 files once a specific category is chosen. A random one from
  // the pool plays each time, but never the same file twice in a row.
  const UNIVERSAL_SOUNDS = ['click1.mp3', 'click2.mp3', 'click3.mp3'];
  const speciesSounds = {
    dog:    ['dog1.mp3', 'dog2.mp3', 'dog3.mp3'],
    cat:    ['cat1.mp3', 'cat2.mp3', 'cat3.mp3'],
    fox:    ['fox1.mp3', 'fox2.mp3', 'fox3.mp3'],
    duck:   ['duck1.mp3', 'duck2.mp3', 'duck3.mp3'],
    bird:   ['bird1.mp3', 'bird2.mp3', 'bird3.mp3'],
    rabbit: ['rabbit1.mp3', 'rabbit2.mp3', 'rabbit3.mp3'],
  };
  const soundCache = {};
  function getSound(file){
    if(!soundCache[file]){
      soundCache[file] = new Audio(file);
      soundCache[file].preload = 'auto';
    }
    return soundCache[file];
  }
  // cloneNode lets rapid repeated clicks (e.g. fast petting) overlap
  // instead of cutting each other off.
  function playSound(el){
    try{
      const node = el.cloneNode(true);
      node.volume = el.volume;
      node.play().catch(() => {});
    } catch(e){}
  }
  let lastAnimalSound = null;
  function pickSound(pool){
    if(pool.length === 1) return pool[0];
    let choice;
    do{
      choice = pool[Math.floor(Math.random() * pool.length)];
    } while(choice === lastAnimalSound);
    lastAnimalSound = choice;
    return choice;
  }
  function playCurrentAnimalSound(){
    const pool = currentSpecies === 'random' ? UNIVERSAL_SOUNDS : (speciesSounds[currentSpecies] || UNIVERSAL_SOUNDS);
    playSound(getSound(pickSound(pool)));
  }
  // The sound assigned to the animal currently shown — picked once when it
  // loads, then reused for every pet click on that same image (no change
  // mid-petting; only the next loaded animal gets a (possibly) different one).
  let assignedAnimalSound = null;
  function assignSoundFor(species){
    const pool = speciesSounds[species] || UNIVERSAL_SOUNDS;
    assignedAnimalSound = pickSound(pool);
  }
  function playAssignedAnimalSound(){
    if(!assignedAnimalSound) return;
    playSound(getSound(assignedAnimalSound));
  }
  // Plays once for every 50th pet, alongside the confetti burst.
  const CONFETTI_SOUND = 'confetti.mp3';
  function playConfettiSound(){
    playSound(getSound(CONFETTI_SOUND));
  }

  const speciesPicker = document.getElementById('speciesPicker');
  const tabIndicator = document.getElementById('tabIndicator');

  function moveIndicatorTo(b){
    tabIndicator.style.width = b.offsetWidth + 'px';
    tabIndicator.style.transform = `translateX(${b.offsetLeft}px)`;
    b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  }

  speciesPicker.addEventListener('click', (e) => {
    const b = e.target.closest('.species-btn');
    if(!b) return;
    currentSpecies = b.dataset.species;
    [...speciesPicker.querySelectorAll('.species-btn')].forEach(c => c.classList.toggle('active', c === b));
    moveIndicatorTo(b);
  });

  // Position the indicator under the initially active tab once fonts/layout settle.
  window.addEventListener('load', () => {
    const active = speciesPicker.querySelector('.species-btn.active');
    if(active) moveIndicatorTo(active);
  });
  requestAnimationFrame(() => {
    const active = speciesPicker.querySelector('.species-btn.active');
    if(active){
      tabIndicator.style.transition = 'none';
      moveIndicatorTo(active);
      requestAnimationFrame(() => { tabIndicator.style.transition = ''; });
    }
  });

  // Each species has one or more reliable, no-key, CORS-friendly sources.
  // A species is tried source-by-source before giving up on it.
  const speciesSources = {
    dog: [
      async () => (await (await fetch('https://dog.ceo/api/breeds/image/random')).json()).message,
      async () => (await (await fetch('https://shibe.online/api/shibes?count=1&urls=true&httpsUrls=true')).json())[0],
    ],
    cat: [
      async () => (await (await fetch('https://api.thecatapi.com/v1/images/search')).json())[0].url,
      async () => (await (await fetch('https://shibe.online/api/cats?count=1&urls=true&httpsUrls=true')).json())[0],
    ],
    fox: [
      async () => (await (await fetch('https://randomfox.ca/floof/')).json()).image,
    ],
    duck: [
      async () => (await (await fetch('https://random-d.uk/api/v2/random')).json()).url,
    ],
    bird: [
      async () => (await (await fetch('https://shibe.online/api/birds?count=1&urls=true&httpsUrls=true')).json())[0],
    ],
    rabbit: [
      async () => (await (await fetch('https://api.bunnies.io/v2/loop/random/?media=gif,png')).json()).media['gif'] ,
    ],
  };

  async function fetchOne(species){
    const sources = speciesSources[species];
    let lastErr;
    for(const source of sources){
      try{
        const url = await source();
        if(url) return url;
      } catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('no source worked');
  }

  async function preload(url){
    return new Promise((resolve, reject) => {
      const test = new Image();
      test.onload = () => resolve(url);
      test.onerror = reject;
      test.src = url;
    });
  }

  // Tries the chosen species across its sources, and if that species keeps
  // failing, falls back to other species so an image reliably shows up.
  async function loadAnimal(){
    loading = true;
    btn.disabled = true;
    img.classList.remove('loaded');
    downloadBtn.style.display = 'none';
    spinner.style.display = 'block';
    loader.classList.add('visible');
    loaderText.textContent = 'hľadám zvieratko…';
    caption.textContent = 'Hľadám niečo roztomité…';

    const speciesToTry = currentSpecies === 'random'
      ? [...allSpecies].sort(() => Math.random() - 0.5)
      : [currentSpecies, ...allSpecies.filter(s => s !== currentSpecies).sort(() => Math.random() - 0.5)];

    let success = false;
    for(const species of speciesToTry){
      try{
        const url = await fetchOne(species);
        await preload(url);
        img.src = url;
        img.classList.add('loaded');
        loader.classList.remove('visible');
        caption.textContent = (speciesLabels[species] || 'Zvieratko') + '. Dýchaj pomaly.';
        downloadBtn.dataset.species = speciesLabels[species] || 'zvieratko';
        downloadBtn.style.display = 'inline-flex';
        assignSoundFor(species);
        success = true;
        break;
      } catch(e){
        continue;
      }
    }
    if(!success){
      spinner.style.display = 'none';
      loaderText.textContent = 'Skús kliknúť ešte raz';
      caption.textContent = 'Internet sa dnes hanbí. Skús to znova.';
    }
    loading = false;
    btn.disabled = false;
  }

  btn.addEventListener('click', async () => {
    if(loading) return;
    playCurrentAnimalSound();
    await loadAnimal();
    stress = Math.max(0, stress - STEP);
    applyStage();
    if(stress <= 0){
      btn.style.display = 'none';
      doneMsg.style.display = 'block';
      resetBtn.style.display = 'inline-block';
    }
  });

  resetBtn.addEventListener('click', () => {
    stress = 100;
    applyStage();
    btn.style.display = 'inline-block';
    doneMsg.style.display = 'none';
    resetBtn.style.display = 'none';
    caption.textContent = 'Zatiaľ žiadne zvieratko. Klikni nižšie.';
    img.classList.remove('loaded');
    img.removeAttribute('src');
    downloadBtn.style.display = 'none';
    loader.classList.remove('visible');
  });

  downloadBtn.addEventListener('click', async () => {
    if(!img.classList.contains('loaded') || !img.src) return;
    downloadBtn.disabled = true;
    const originalLabel = downloadBtn.innerHTML;
    try{
      const res = await fetch(img.src);
      const blob = await res.blob();
      const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
      const name = (downloadBtn.dataset.species || 'zvieratko').toLowerCase();
      const objectUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = `${name}-${Date.now()}.${ext}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objectUrl);
    } catch(e){
      // Cross-origin image the browser won't let us fetch as a blob —
      // fall back to opening it directly so the user can save it manually.
      window.open(img.src, '_blank');
    }
    downloadBtn.innerHTML = originalLabel;
    downloadBtn.disabled = false;
  });

  applyStage();

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const petCountEl = document.getElementById('petCount');
  let petCount = 0;

  img.addEventListener('click', () => {
    if(!img.classList.contains('loaded')) return;
    lightboxImg.src = img.src;
    petCount = 0;
    petCountEl.textContent = '';
    lightbox.classList.add('open');
  });

  lightboxImg.addEventListener('click', (e) => {
    e.stopPropagation();
    playAssignedAnimalSound();
    lightboxImg.classList.remove('petted');
    // restart the animation even on rapid repeated clicks
    void lightboxImg.offsetWidth;
    lightboxImg.classList.add('petted');
    petCount++;
    petCountEl.textContent = petCount === 1 ? 'pohladkané 1×' : 'pohladkané ' + petCount + '×';
    if(petCount % 50 === 0){
      playConfettiSound();
      launchConfetti();
    }
  });
  lightboxImg.addEventListener('animationend', () => {
    lightboxImg.classList.remove('petted');
  });

  function launchConfetti(){
    const colors = ['#E8593E', '#F2A65A', '#8FAE5A', '#4C9A6A', '#E0A24A', '#E8813E'];
    const count = 80;
    for(let i=0; i<count; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (2.2 + Math.random()*1.4) + 's';
      piece.style.animationDelay = (Math.random()*0.4) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4200);
    }
  }

  function closeLightbox(){ lightbox.classList.remove('open'); }
  lightbox.addEventListener('click', closeLightbox);
  lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
